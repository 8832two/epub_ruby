# Configuration example for epub-ruby
# Copy to config.yaml and customize settings

# LLM settings
llm:
  # Whether to use LLM for context-aware reading
  use_llm: false
  
  # Model to use (deepseek-v4-flash, deepseek-v4-pro, gpt-4-turbo, etc.)
  model: "deepseek-v4-flash"
  
  # API key (optional if set via environment variable)
  # api_key: "sk-..."
  
  # Base URL for OpenAI-compatible APIs
  base_url: "https://api.deepseek.com"
  
  # Maximum sentences per API call
  # Lower = faster response time, higher = fewer API calls
  batch_size: 60
  
  # Maximum concurrent API calls (0 = unlimited)
  # Useful for free tiers or rate-limited APIs
  # Example: Gemini free tier = 5-10
  max_concurrent: 0

# Processing settings
processing:
  # Number of worker threads (0 = auto-detect based on CPU cores)
  num_workers: 0
  
  # Default output directory
  # output_dir: "/path/to/output"

# GUI settings
gui:
  # Theme: "light" or "dark"
  theme: "light"
  
  # Show error logs in GUI
  show_logs: true
  
  # Remember last used settings
  remember_settings: true


# ═══════════════════════════════════════════════════════════════════════════
# USAGE EXAMPLES
# ═══════════════════════════════════════════════════════════════════════════

# Example 1: Dictionary mode (no LLM)
# Just process locally without API calls

# Example 2: DeepSeek with batch size 30
#
# llm:
#   use_llm: true
#   model: deepseek-v4-flash
#   api_key: "sk-your-api-key"
#   batch_size: 30

# Example 3: Free tier Gemini with rate limiting
#
# llm:
#   use_llm: true
#   model: gemini-2-flash-preview
#   api_key: "your-gemini-key"
#   max_concurrent: 5    # Respect 15 RPM limit
#   batch_size: 20

# Example 4: Using multiple providers (API failover)
# This is configured via CLI: --api "provider:key:model:url"
