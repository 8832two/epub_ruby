[project]
name = "epub-ruby"
version = "0.1.0"
requires-python = ">=3.8,!=3.9.7"
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "soupsieve>=2.5",
    "fugashi",
    "unidic_lite",
    "openai>=1.0.0",
]

[project.scripts]
epub-ruby = "epub_ruby.cli:main"

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"
